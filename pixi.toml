[workspace]
name = "panel-openapi"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tasks]
postinstall = "pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run -a"

# Runtime dependencies, so every environment can import the package. The
# editable install below is run with --no-deps, so anything missing here is
# missing at import time.
[dependencies]
python = ">=3.10"
panel = ">=1.5.0"
panel-material-ui = ">=0.4.0"
openapi-pydantic = ">=0.5.0"
httpx = "*"
packaging = "*"
pip = "*"
hatchling = "*"
hatch-vcs = "*"
setuptools = ">=61"
setuptools-scm = "*"

[feature.py310.dependencies]
python = "3.10.*"
[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[environments]
default = ["py312", "test"]
test-310 = ["py310", "test"]
test-311 = ["py311", "test"]
test-312 = ["py312", "test"]
test-313 = ["py313", "test"]
docs = ["py312", "docs"]
build = ["py312", "build"]
lint = { features = ["lint"], no-default-feature = true }

# =============================================
# ================== TEST =====================
# =============================================

[feature.test.dependencies]
pytest = ">=6"
pytest-asyncio = "*"
pytest-cov = "*"
mypy = "*"

[feature.test.tasks]
test = { cmd = "pytest", depends-on = ["postinstall"] }
test-coverage = { cmd = "pytest --cov=panel_openapi --cov-report=xml --cov-report=term-missing", depends-on = [
  "postinstall",
] }

# =============================================
# =================== DOCS ====================
# =============================================

[feature.docs.dependencies]
zensical = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"

[feature.docs.tasks]
docs = { cmd = "zensical serve", depends-on = ["postinstall"] }
docs-build = { cmd = "zensical build", depends-on = ["postinstall"] }

# =============================================
# ================== BUILD ====================
# =============================================

[feature.build.dependencies]
python-build = "*"
twine = "*"
wheel = "*"

[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

# =============================================
# ================== LINT =====================
# =============================================

[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
lint-install = "pre-commit install"
