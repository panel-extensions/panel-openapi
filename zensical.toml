[project]
site_name = "panel-openapi"
site_description = "Panel extension to auto-generate Forms from OpenAPI schemas."
site_author = "Philipp Rudiger"
repo_url = "https://github.com/panel-extensions/panel-openapi"
repo_name = "panel-extensions/panel-openapi"
edit_uri = "edit/main/docs/"
nav = [
  {"Home" = "index.md"},
  {"Quickstart" = "quickstart.md"},
  {"How-to" = [
    {"Build a Form" = "how-to/build-a-form.md"},
    {"Load a Specification" = "how-to/load-a-spec.md"},
    {"Understand Widget Mapping" = "how-to/widget-mapping.md"},
    {"Switch Operations" = "how-to/switch-operations.md"},
    {"Authenticate Requests" = "how-to/authenticate.md"},
    {"Read and Submit Values" = "how-to/values.md"},
    {"Edit Records" = "how-to/edit-records.md"},
    {"Customize the Layout" = "how-to/custom-layout.md"},
    {"Build Your Own Form" = "how-to/build-your-own.md"}
  ]},
  {"Examples" = "examples.md"},
  {"Reference" = "reference/panel_openapi.md"}
]

# Theme configuration
[project.theme]
logo = "assets/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow"
]

# Color palette - light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

# Color palette - dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
url_download = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

# Plugins
[project.plugins]
search = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_if_no_docstring = true
filters = ["!^_"]

# Extra configuration
[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/panel-extensions"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/panel_org"

